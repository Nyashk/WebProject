<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtFair - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="background">
        <header>
            <h1>ArtFair</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Login</a>
            </nav>
        </header>

        <div class="login-container">
            <div class="form-wrapper">
                <form class="login-form" id="login-form">
                    <h2>Sign In</h2>
                    <div class="input-field">
                        <input type="email" id="email" required placeholder=" ">
                        <label for="email">Email</label>
                    </div>
                    
                    <div class="input-field">
                        <input type="password" id="password" required placeholder=" ">
                        <label for="password">Password</label>
                    </div>
                    <div class="options">
                        <label><input type="checkbox"> Remember me⠀⠀⠀⠀⠀</label>
                        <a href="#">Forget password</a>
                    </div>
                    <button type="submit">Login</button>
                    <p class="register-link">Don’t have an account? <a href="#" id="show-register">Register</a></p>
                </form>

                <form class="register-form" id="register-form" style="display: none;">
                    <h2>Register</h2>
                    <div class="input-field">
                        <input type="text" id="username" required placeholder=" ">
                        <label for="username">Username</label>
                    </div>

                    <div class="input-field">
                        <input type="email" id="reg-email" required placeholder=" ">
                        <label for="reg-email">Email</label>
                    </div>
                    
                    <div class="input-field">
                        <input type="password" id="reg-password" required placeholder=" ">
                        <label for="reg-password">Password</label>
                    </div>

                    <button type="submit">Register</button>
                    <p class="login-link">Already have an account? <a href="#" id="show-login">Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
